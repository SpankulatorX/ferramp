[package]
name = "ferramp"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A from-scratch, cross-platform reimplementation of the classic two-point-x era skinnable media player, in Rust"
rust-version = "1.88"
repository = "https://github.com/SpankulatorX/ferramp"
readme = "README.md"
keywords = ["audio", "player", "skins", "music", "gui"]
categories = ["multimedia::audio"]

[dependencies]
winit = "0.30.13"
softbuffer = "0.4.8"
symphonia = { version = "0.6", features = ["all"] }
cpal = "0.18"
rubato = "5"
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["bmp", "png", "ico"] }
swash = "0.2"
rfd = "0.17"
lofty = "0.25"
dirs = "7"
ureq = { version = "3", default-features = false, features = ["gzip"] }
rtrb = "0.4"
arboard = { version = "3", default-features = false }

[build-dependencies]
winresource = "0.1"

[features]
default = ["https"]
# TLS for https:// streams (needs a C compiler for the target when cross-building).
https = ["ureq/rustls"]

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.14", features = ["shape"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSEvent"] }
objc2-foundation = "0.3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
