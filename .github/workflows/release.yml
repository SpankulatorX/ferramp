name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev rpm
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - name: Install appimagetool
        # Pinned releases with checksums: this job can write to the repository.
        run: |
          case "${{ matrix.arch }}" in
            x86_64)
              tool_sha=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
              runtime_sha=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d ;;
            aarch64)
              tool_sha=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
              runtime_sha=00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444 ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL -o appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage"
          curl -fsSL -o appimage-runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${{ matrix.arch }}"
          printf '%s  %s\n' "$tool_sha" appimagetool.AppImage "$runtime_sha" appimage-runtime | sha256sum -c -
          # appimagetool is itself an AppImage; extract it on runners without FUSE.
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null
          echo "$RUNNER_TEMP/squashfs-root/usr/bin" >> "$GITHUB_PATH"
          echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/appimage-runtime" >> "$GITHUB_ENV"
      - name: Package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          name=ferramp-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}
          mkdir -p "dist/$name/icons"
          cp target/release/ferramp packaging/linux/install.sh assets/ferramp.desktop \
             README.md LICENSE-MIT LICENSE-APACHE NOTICE "dist/$name/"
          cp assets/icons/ferramp-*.png "dist/$name/icons/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          bash packaging/linux/build-deb.sh target/release/ferramp dist
          bash packaging/linux/build-rpm.sh target/release/ferramp dist
          bash packaging/linux/build-appimage.sh target/release/ferramp dist
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - name: Package
        shell: pwsh
        run: |
          $name = "ferramp-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/release/ferramp.exe, README.md, LICENSE-MIT, LICENSE-APACHE, NOTICE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.zip

  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - run: cargo test --release --locked
      - name: Package
        run: |
          version=${GITHUB_REF_NAME#v}
          app=dist/Ferramp/Ferramp.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" ferramp.iconset
          lipo -create -output "$app/Contents/MacOS/ferramp" \
            target/aarch64-apple-darwin/release/ferramp target/x86_64-apple-darwin/release/ferramp
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp assets/icons/ferramp-16.png ferramp.iconset/icon_16x16.png
          cp assets/icons/ferramp-32.png ferramp.iconset/icon_16x16@2x.png
          cp assets/icons/ferramp-32.png ferramp.iconset/icon_32x32.png
          cp assets/icons/ferramp-64.png ferramp.iconset/icon_32x32@2x.png
          cp assets/icons/ferramp-128.png ferramp.iconset/icon_128x128.png
          cp assets/icons/ferramp-256.png ferramp.iconset/icon_128x128@2x.png
          cp assets/icons/ferramp-256.png ferramp.iconset/icon_256x256.png
          iconutil -c icns ferramp.iconset -o "$app/Contents/Resources/ferramp.icns"
          codesign --force --deep --sign - "$app"
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE dist/Ferramp/
          ln -s /Applications dist/Ferramp/Applications
          hdiutil create -volname Ferramp -srcfolder dist/Ferramp -ov -format UDZO \
            "dist/ferramp-${GITHUB_REF_NAME}-macos-universal.dmg"
          lipo -info "$app/Contents/MacOS/ferramp"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * \
            --title "Ferramp ${GITHUB_REF_NAME}" \
            --notes-file ../packaging/release-notes.md
